.forest-milestones.milestone-sticky-section {

  background: linear-gradient(180deg, #f7ecd7 0%, #fdf6ec 30%, #f9eedc 100%) !important;

.forest-milestones.milestone-sticky-section::before,
.forest-milestones.milestone-sticky-section::after {
  display: none !important;
}

.ms-sticky-container {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(320px, 0.85fr) minmax(420px, 1.15fr);

  margin-bottom: 14px;
}

.ms-sticky-title {
  margin: 0 0 16px !important;
  font: 600 clamp(38px, 4.4vw, 64px)/0.98 var(--display) !important;
  letter-spacing: -0.04em !important;
  color: #3b0d13 !important;
}

.ms-sticky-title em {

@media (max-width: 760px) {
